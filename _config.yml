# Lab 05: customization of the DS4PS Beautiful Jekyll archive.
title: Evidence & Public Practice
description: "A learning portfolio on reproducible publishing and clear communication in public affairs."
author: nicholasspino
url: "https://nicholasspino.github.io"
baseurl: "/lab-05-site"
navbar-links:
  About Me: "aboutme"
  Resources:
    - Beautiful Jekyll: "https://beautifuljekyll.com"
    - Learn markdown: "https://www.markdowntutorial.com/"
    - Getting Started: "getstarted"
  Table Demo: "table-demo"
  Repository: "https://github.com/nicholasspino/lab-05-site"
social-network-links:
  github: nicholasspino
share-links-active: {}
post_search: false
navbar-col: "#F4F7F8"
navbar-text-col: "#183344"
navbar-border-col: "#CDD9DD"
navbar-children-col: "#F4F7F8"
page-col: "#FFFFFF"
text-col: "#293E49"
link-col: "#006B70"
hover-col: "#884426"
footer-col: "#EDF2F3"
footer-text-col: "#475D68"
footer-link-col: "#183344"
mobile-theme-col: "#183344"
site-css:
  - "/assets/css/lab.css"
timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
    values:
      layout: page
      comments: false
      social-share: false
      nav-short: true
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - _posts/
  - beautiful-jekyll-theme.gemspec
  - staticman.yml
plugins:
  - jekyll-sitemap
